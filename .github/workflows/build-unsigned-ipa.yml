name: Build unsigned IPA

# Builds the iOS app for a real device WITHOUT code signing, then packages it as an
# .ipa. Download the artifact and sign/install it on Windows with Sideloadly (free
# Apple ID works). No Mac needed. See docs/build-ipa-on-windows.md.

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/IPhoneAgent.app Payload/
          zip -qry ESP32Agent-unsigned.ipa Payload
          ls -lh ESP32Agent-unsigned.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32Agent-unsigned-ipa
          path: |
            ios/ESP32Agent-unsigned.ipa
            ios/build.log
          if-no-files-found: error
